<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" href="./assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Jessica Randall | Social links profile</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <main class="social-card">
    <header class="social-card-header">
      <img class="card-image" src="./assets/images/avatar-jessica.jpeg" alt="" >
      <h1 class="name textPreset1">Jessica Randall</h1>
      <h2 class="location textPreset2Bold">London, United Kingdom</h2>
      <h2 class="tagline textPreset2">"Front-end developer and avid reader."</h2>
    </header>
    <nav class="Social-links textPreset2Bold">
      <a class="textPreset2Bold" href="https://github.com" target="_blank">GitHub</a>
      <a class="textPreset2Bold" href="https://www.frontendmentor.io" target="_blank">Frontend Mentor</a>
      <a class="textPreset2Bold" href="https://www.linkedin.com" target="_blank">LinkedIn</a>
      <a class="textPreset2Bold" href="https://x.com" target="_blank">Twitter</a>
      <a class="textPreset2Bold" href="https://instagram.com" target="_blank">Instagram</a>
    </nav>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/RoomForEpsilon">John</a>.
  </footer>
</body>
</html>
