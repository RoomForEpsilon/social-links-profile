<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Jessica Randall | Social links profile</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <article class="profile" aria-labelledby="profile-name">
      <header class="profile__header">
        <img class="profile__avatar" src="./assets/images/avatar-jessica.jpeg" alt="" width="88" height="88">
        <h1 class="profile__name" id="profile-name">Jessica Randall</h1>
        <p class="profile__location">London, United Kingdom</p>
      </header>

      <p class="profile__bio">"Front-end developer and avid reader."</p>

      <nav class="profile__nav" aria-label="Social links">
        <!-- Replace these platform homepages with the owner's actual profile URLs. -->
        <ul class="profile__links">
          <li><a class="profile__link" href="https://github.com/">GitHub</a></li>
          <li><a class="profile__link" href="https://www.frontendmentor.io/">Frontend Mentor</a></li>
          <li><a class="profile__link" href="https://www.linkedin.com/">LinkedIn</a></li>
          <li><a class="profile__link" href="https://twitter.com/">Twitter</a></li>
          <li><a class="profile__link" href="https://www.instagram.com/">Instagram</a></li>
        </ul>
      </nav>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://www.frontendmentor.io/profile/RoomForEpsilon">John</a>.
  </footer>
</body>
</html>
